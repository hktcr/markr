<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0b0d">
<meta name="description" content="MärkR, Håkans bokmärkesarkiv med sökning.">
<title>MärkR</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="ikon-192.png">
</head>
<body>

<div class="skal rymd" id="skal">

  <header class="topp">
    <h1 class="ordmarke">MärkR</h1>
    <div class="sokfalt" id="sokfalt">
      <span class="marke" aria-hidden="true"></span>
      <div class="filterrad" id="aktiva-filter"></div>
      <input type="search" id="sok" placeholder="Sök i arkivet" autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false" enterkeyhint="go"
             aria-label="Sök bland bokmärken" aria-describedby="status">
      <kbd class="snabb" aria-hidden="true">/</kbd>
    </div>
    <p class="status" id="status" role="status" aria-live="polite">Laddar</p>
  </header>

  <main class="innehall" id="innehall">

    <section class="listlage" id="listlage" hidden aria-label="Alla områden">
      <h2 class="etikett">Verksamhetsområden</h2>
      <div class="katrad" id="kategorilista"></div>
    </section>

    <section class="resultat" id="resultat" hidden>
      <div class="relaterat" id="relaterat" hidden>
        <h2 class="etikett" id="relaterat-rubrik">I träffarna</h2>
        <div class="katrad" id="relaterade-taggar"></div>
      </div>
      <ul class="traffar" id="traffar"></ul>
      <button type="button" class="mer" id="visa-alla" hidden></button>
    </section>

  </main>

  <footer class="horisont" id="horisont">
    <button type="button" class="lank" id="lank-senaste">Senast tillagda</button>
    <span class="lankskilje" aria-hidden="true">·</span>
    <button type="button" class="lank" id="lank-lista">Alla områden</button>
    <span class="lankskilje" aria-hidden="true">·</span>
    <a class="lank" href="sites.html">ChatGPT siter</a>
    <span class="horisontinfo" id="horisont-info"></span>
  </footer>

  <footer class="hjalp" aria-hidden="true">
    <kbd>/</kbd> sök <span class="skilje"></span>
    <kbd>↑</kbd><kbd>↓</kbd> bläddra <span class="skilje"></span>
    <kbd>Enter</kbd> ny flik <span class="skilje"></span>
    <kbd>Esc</kbd> till himlen
  </footer>

</div>

<canvas id="himmel" aria-hidden="true"></canvas>
<nav id="noder" aria-label="Verksamhetsområden"></nav>
<div class="brodrost" id="brodrost" role="status" aria-live="polite"></div>

<noscript><p style="padding:2rem">MärkR behöver JavaScript för att söka.</p></noscript>
<script src="app.js"></script>
</body>
</html>
